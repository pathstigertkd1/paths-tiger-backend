cd /e/
cd "tailwind css/video 4/paths-tiger-backend/public"

cat > instructor-login.html << 'EOF'
<!DOCTYPE html>
<html>
<head>
    <title>Instructor Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900">
    <div class="min-h-screen flex items-center justify-center">
        <div class="bg-white p-8 rounded-lg shadow-lg w-96">
            <h1 class="text-2xl font-bold mb-4 text-center">Instructor Login</h1>
            <form id="loginForm">
                <input type="email" id="email" placeholder="Email" class="w-full p-2 mb-3 border rounded" value="instructor@pathstiger.com">
                <input type="password" id="password" placeholder="Password" class="w-full p-2 mb-3 border rounded" value="Instructor@123">
                <button type="submit" class="w-full bg-orange-600 text-white p-2 rounded">Login</button>
            </form>
        </div>
    </div>
    <script>
        const API_BASE_URL = 'http://localhost:5000/api';
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const response = await fetch(`${API_BASE_URL}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await response.json();
            if (data.success && data.user.role === 'instructor') {
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                window.location.href = 'instructor-dashboard.html';
            } else {
                alert('Invalid instructor credentials');
            }
        });
    </script>
</body>
</html>
EOF
