<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Student Dashboard - Paths Tiger</title>
    <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-gray-100">
    <script>
        const API_BASE_URL = 'http://localhost:5000/api';
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        if (!token) window.location.href = 'login.html';
        
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('studentName').textContent = user.name || 'Student';
            document.getElementById('studentBelt').textContent = user.beltLevel || 'White';
            loadAttendance();
            loadGrades();
            loadAnnouncements();
        });
        
        function logout() { localStorage.clear(); window.location.href = 'login.html'; }
        
        async function loadAttendance() {
            const container = document.getElementById('attendanceList');
            container.innerHTML = '<div class="text-center py-4">Loading...</div>';
            try {
                const res = await fetch(`${API_BASE_URL}/member/attendance`, { headers: { 'Authorization': 'Bearer ' + token } });
                const attendance = await res.json();
                const present = attendance.filter(a => a.status === 'present').length;
                const total = attendance.length;
                document.getElementById('attendanceRate').textContent = total > 0 ? Math.round((present/total)*100) : 0;
                container.innerHTML = attendance.slice(0,5).map(a => `<div class="flex justify-between p-2 border-b"><div>${new Date(a.classDate).toLocaleDateString()}</div><div class="${a.status === 'present' ? 'text-green-600' : 'text-red-600'}">${a.status}</div></div>`).join('');
            } catch(error) { container.innerHTML = '<div class="text-center py-4 text-red-500">Error loading attendance</div>'; }
        }
        
        async function loadGrades() {
            const container = document.getElementById('gradesList');
            container.innerHTML = '<div class="text-center py-4">Loading grades...</div>';
            setTimeout(() => { container.innerHTML = '<div class="space-y-2"><div class="flex justify-between p-2 border-b"><div>Forms (Poomsae)</div><div class="font-bold text-green-600">85%</div></div><div class="flex justify-between p-2 border-b"><div>Sparring</div><div class="font-bold text-orange-600">72%</div></div><div class="flex justify-between p-2"><div>Breaking</div><div class="font-bold text-green-600">90%</div></div></div>'; }, 500);
        }
        
        async function loadAnnouncements() {
            const container = document.getElementById('announcementsList');
            container.innerHTML = '<div class="text-center py-4">Loading announcements...</div>';
            setTimeout(() => { container.innerHTML = '<div class="space-y-2"><div class="border-l-4 border-orange-600 pl-3"><p class="font-semibold">Belt Testing - March 30th</p><p class="text-sm text-gray-600">All students must confirm attendance</p></div><div class="border-l-4 border-blue-600 pl-3"><p class="font-semibold">Academy Closed - March 23rd</p><p class="text-sm text-gray-600">Due to maintenance</p></div></div>'; }, 500);
        }
    </script>
    
    <nav class="bg-orange-500 shadow-lg sticky top-0 z-50"><div class="max-w-7xl mx-auto px-4"><div class="flex justify-between items-center h-16"><div class="flex items-center space-x-2"><span class="text-3xl">🥋</span><span class="font-bold text-xl text-white">Paths Tiger</span></div><div class="flex items-center space-x-4"><span class="text-white">Welcome, <span id="studentName">Student</span>!</span><a href="#" onclick="logout()" class="text-white px-4 py-2 bg-amber-950 rounded-2xl">Logout</a></div></div></div></nav>
    
    <div class="max-w-7xl mx-auto px-4 py-8">
        <div class="bg-white rounded-2xl shadow-lg p-8 mb-8"><div class="flex items-center gap-6"><div class="w-24 h-24 bg-orange-100 rounded-full flex items-center justify-center text-5xl">🥋</div><div><h1 class="text-3xl font-bold">Welcome, <span id="studentName2">Student</span>!</h1><p class="text-gray-600">Member since <span id="joinDate">2026</span> | <span id="studentBelt">White</span> Belt</p></div></div></div>
        
        <div class="grid md:grid-cols-3 gap-6 mb-8"><div class="bg-white rounded-xl shadow p-6"><div class="text-3xl font-bold text-orange-600">12</div><div class="text-gray-600">Classes Attended</div></div><div class="bg-white rounded-xl shadow p-6"><div class="text-3xl font-bold text-orange-600"><span id="attendanceRate">0</span>%</div><div class="text-gray-600">Attendance Rate</div></div><div class="bg-white rounded-xl shadow p-6"><div class="text-3xl font-bold text-orange-600">3</div><div class="text-gray-600">Days to Next Belt</div></div></div>
        
        <div class="grid md:grid-cols-2 gap-6"><div class="bg-white rounded-xl shadow p-6"><h2 class="text-xl font-bold mb-4">📊 My Grades</h2><div id="gradesList"></div></div><div class="bg-white rounded-xl shadow p-6"><h2 class="text-xl font-bold mb-4">📝 Recent Attendance</h2><div id="attendanceList"></div></div></div>
        
        <div class="mt-6 bg-white rounded-xl shadow p-6"><h2 class="text-xl font-bold mb-4">📢 Announcements</h2><div id="announcementsList"></div></div>
        
        <div class="mt-6 flex gap-4 justify-center"><a href="payment.html" class="bg-orange-600 text-white px-6 py-2 rounded-full">💳 Make Payment</a><a href="contact.html" class="bg-gray-600 text-white px-6 py-2 rounded-full">📧 Contact Instructor</a></div>
    </div>
</body>
</html>
