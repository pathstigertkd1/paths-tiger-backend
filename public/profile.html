    <!-- Filter Script -->
    <script>
        function filterClasses(level) {
            const rows = document.querySelectorAll('tbody tr');
            rows.forEach(row => {
                if(level === 'all') {
                    row.style.display = '';
                } else {
                    const cells = row.querySelectorAll('td');
                    let hasClass = false;
                    for(let i = 1; i < cells.length; i++) {
                        if(cells[i].textContent.includes(level)) {
                            hasClass = true;
                            break;
                        }
                    }
                    row.style.display = hasClass ? '' : 'none';
                }
            });
        }
    </script>
